# Cryptographic libraries declared in dependency manifests (requirements.txt,
# pyproject.toml, Pipfile, go.mod, package.json, pom.xml, build.gradle, Cargo.toml).
# Libraries are INVENTORY (tier INFO, not scored): the CBOM lists them and the
# report says whether the declared version can already do post-quantum crypto.
#   key         "<ecosystem>:<package>"; a '*' matches any suffix (e.g. jjwt-*)
#   imports     module / package prefixes the code scanner reports as `library`
#               (links code findings to the manifest that declares the library)
#   pqc         native  = a post-quantum library (ML-KEM / ML-DSA / SLH-DSA ...)
#   pqc_since   first version whose API offers ML-KEM / ML-DSA
#   pq_tls_default_since  first version whose TLS stack uses a hybrid PQ group by default
#   deprecated  why it should not be used at all (classical problem)
#   verified    false = version facts from memory, not re-checked (flag pqc-data-unverified)
libraries:
  # ---- Python (PyPI)
  "pypi:cryptography":
    display: pyca/cryptography
    imports: [cryptography]
    pqc_since: "48.0.0"      # checked 2026-10-11: the 48.0.0 wheel generates ML-KEM-768 / ML-DSA-65, the 47.0.0 wheel raises UnsupportedAlgorithm
    pqc_api: ML-KEM (FIPS 203), ML-DSA (FIPS 204)
  "pypi:pycryptodome": {imports: [Crypto]}
  "pypi:pycryptodomex": {imports: [Cryptodome, pycryptodome]}   # the code scanner reports both as "pycryptodome"
  "pypi:pycrypto":
    imports: [Crypto, pycryptodome]                            # same Crypto.* API
    deprecated: "unmaintained since 2013 (last release 2.6.1, CVE-2013-7459); use pyca/cryptography or pycryptodome"
  "pypi:pyopenssl": {imports: [OpenSSL]}
  "pypi:rsa": {imports: [rsa]}
  "pypi:ecdsa": {imports: [ecdsa]}
  "pypi:pynacl": {imports: [nacl]}
  "pypi:paramiko": {imports: [paramiko]}
  "pypi:bcrypt": {imports: [bcrypt]}
  "pypi:passlib": {imports: [passlib]}
  "pypi:argon2-cffi": {imports: [argon2]}
  "pypi:pyjwt": {imports: [jwt]}
  "pypi:python-jose": {imports: [jose]}
  "pypi:jwcrypto": {imports: [jwcrypto]}
  "pypi:m2crypto": {imports: [M2Crypto]}
  "pypi:tink": {imports: [tink]}
  "pypi:liboqs-python": {imports: [oqs], pqc: native}
  "pypi:pqcrypto": {imports: [pqcrypto], pqc: native}
  "pypi:kyber-py": {imports: [kyber_py], pqc: native}
  "pypi:dilithium-py": {imports: [dilithium_py], pqc: native}
  # ---- Go (go.mod). `golang:stdlib` comes from the `go` directive.
  "golang:stdlib":
    display: Go standard library (crypto/*)
    imports: [crypto]
    pqc_since: "1.24"            # go.dev/doc/go1.24: new crypto/mlkem (ML-KEM-768 / ML-KEM-1024)
    pqc_api: ML-KEM (FIPS 203) via crypto/mlkem
    pq_tls_default_since: "1.24" # crypto/tls enables X25519MLKEM768 by default (GODEBUG tlsmlkem); go 1.23 used the X25519Kyber768Draft00 draft
  "golang:golang.org/x/crypto": {imports: [golang.org/x/crypto]}
  "golang:github.com/golang-jwt/jwt*": {imports: [github.com/golang-jwt/jwt]}
  "golang:github.com/go-jose/go-jose*": {imports: [github.com/go-jose/go-jose]}
