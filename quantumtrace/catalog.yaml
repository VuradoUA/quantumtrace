# ---------------------------------------------------------------------------
# AWS Elastic Load Balancing TLS security policies.
# Source: AWS docs "Security policies for your Application/Network Load Balancer"
# (cipher tables read 2026-10-11). `verified: false` = taken from memory because
# that part of the doc page could not be retrieved; double-check before relying on it.
# pq_groups: hybrid key exchange groups the policy offers (AWS "-PQ-" policies).
# Every policy also offers classical ECDHE key exchange.
aws_elb_policies:
  ELBSecurityPolicy-2016-08:
    tls_versions: ["1.0", "1.1", "1.2"]
    ciphers: &legacy18
      [ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256, ECDHE-ECDSA-AES128-SHA256,
       ECDHE-RSA-AES128-SHA256, ECDHE-ECDSA-AES128-SHA, ECDHE-RSA-AES128-SHA,
       ECDHE-ECDSA-AES256-GCM-SHA384, ECDHE-RSA-AES256-GCM-SHA384, ECDHE-ECDSA-AES256-SHA384,
       ECDHE-RSA-AES256-SHA384, ECDHE-ECDSA-AES256-SHA, ECDHE-RSA-AES256-SHA,
       AES128-GCM-SHA256, AES128-SHA256, AES128-SHA, AES256-GCM-SHA384, AES256-SHA256, AES256-SHA]
  ELBSecurityPolicy-2015-05:
    tls_versions: ["1.0", "1.1", "1.2"]
    ciphers: *legacy18
  ELBSecurityPolicy-TLS-1-1-2017-01:
    tls_versions: ["1.1", "1.2"]
    ciphers: *legacy18
  ELBSecurityPolicy-TLS-1-2-Ext-2018-06:
    tls_versions: ["1.2"]
    ciphers: *legacy18
  ELBSecurityPolicy-TLS-1-2-2017-01:
    tls_versions: ["1.2"]
    ciphers:
      [ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256, ECDHE-ECDSA-AES128-SHA256,
       ECDHE-RSA-AES128-SHA256, ECDHE-ECDSA-AES256-GCM-SHA384, ECDHE-RSA-AES256-GCM-SHA384,
       ECDHE-ECDSA-AES256-SHA384, ECDHE-RSA-AES256-SHA384,
       AES128-GCM-SHA256, AES128-SHA256, AES256-GCM-SHA384, AES256-SHA256]
  ELBSecurityPolicy-FS-1-2-Res-2020-10:
    tls_versions: ["1.2"]
    verified: false
    ciphers:
      [ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256,
       ECDHE-ECDSA-AES256-GCM-SHA384, ECDHE-RSA-AES256-GCM-SHA384]
  ELBSecurityPolicy-TLS13-1-2-2021-06:
    tls_versions: ["1.2", "1.3"]
    ciphers: &tls13_12
      [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256,
       ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256, ECDHE-ECDSA-AES128-SHA256,
       ECDHE-RSA-AES128-SHA256, ECDHE-ECDSA-AES256-GCM-SHA384, ECDHE-RSA-AES256-GCM-SHA384,
       ECDHE-ECDSA-AES256-SHA384, ECDHE-RSA-AES256-SHA384]
  ELBSecurityPolicy-TLS13-1-2-Res-2021-06:
    tls_versions: ["1.2", "1.3"]
    ciphers: &tls13_res
      [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256,
       ECDHE-ECDSA-AES128-GCM-SHA256, ECDHE-RSA-AES128-GCM-SHA256,
       ECDHE-ECDSA-AES256-GCM-SHA384, ECDHE-RSA-AES256-GCM-SHA384]
  ELBSecurityPolicy-TLS13-1-3-2021-06:
    tls_versions: ["1.3"]
    ciphers: &tls13_only [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256]
  ELBSecurityPolicy-TLS13-1-2-PQ-2025-09:
    tls_versions: ["1.2", "1.3"]
    ciphers: *tls13_12
    pq_groups: &pq_groups [X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024]
  ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09:
    tls_versions: ["1.2", "1.3"]
    ciphers: *tls13_res
    pq_groups: *pq_groups
  ELBSecurityPolicy-TLS13-1-3-PQ-2025-09:
    tls_versions: ["1.3"]
    ciphers: *tls13_only
    pq_groups: *pq_groups

