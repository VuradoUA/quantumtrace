# QuantumTrace algorithm catalog: the single source of truth.
#
# Parsers report what they SEE (a raw name such as "SHA1withRSA", "RSA_2048",
# "TLS_RSA_WITH_AES_128_CBC_SHA", "curve25519-sha256"). The classifier resolves
# that name against this file and decides tier, HNDL exposure, flags, the PQC
# replacement and the FIPS standard. Adding an algorithm = adding an entry here.
#
# Entry fields
#   name        display name
#   kind        asymmetric | symmetric | hash | mac | kdf | pqc | hybrid | none
#   threat      shor (broken by a quantum computer) | grover (weakened) | none
#   tier        fixed tier (CRITICAL / MEDIUM / SAFE / PLAINTEXT) ...
#   tier_by_bits  ... or a tier that depends on the key size (symmetric ciphers)
#   primitive   CycloneDX 1.6 primitive; primitive_by_role overrides it per role
#   min_bits    asymmetric keys below this are also weak TODAY (flag weak-key-size)
#   classical_by_bits / classical_level  classical security in bits
#   nist_level / nist_level_by_bits      NIST quantum security category (0 = broken)
#   flags       always-on flags (classically-broken, deprecated, hybrid, ...)
#   oid         object identifier (for the CBOM)
#   replacement / standard   what to migrate to (asymmetric entries use the
#               role-based table under `replacements` instead)
#   aliases     names that mean this algorithm; compared case- and punctuation-
#               insensitively. A mapping item can also fix bits/mode.
#   patterns    regexes (on the lowercase name) with optional (?P<bits>) / (?P<mode>)

replacements:
  # Used for every algorithm with threat: shor, chosen by the role it plays.
  confidentiality:            # key exchange / key transport / encryption -> HNDL
    name: ML-KEM-768 (hybrid X25519MLKEM768 for TLS, mlkem768x25519-sha256 for SSH)
    standard: FIPS 203
  signature:
    name: ML-DSA-65
    standard: FIPS 204
  long-lived-signature:       # root CAs, code signing, firmware (parser sets flag long-lived)
    name: SLH-DSA (or ML-DSA-87)
    standard: FIPS 205

algorithms:
  # ---------------------------------------------------------------- asymmetric (Shor)
  RSA:
    name: RSA
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: pke
    primitive_by_role: {signature: signature, certificate: signature}
    min_bits: 2048
    classical_by_bits: {512: 50, 1024: 80, 2048: 112, 3072: 128, 4096: 140, 7680: 192, 15360: 256}
    nist_level: 0
    oid: 1.2.840.113549.1.1.1
    aliases: [rsa, rsaencryption, rsa-oaep, rsaes-oaep, rsassa-pss, rsa-pss]
    patterns: ['^rsa[-_ ]?(?P<bits>\d{3,5})$']
  DSA:
    name: DSA
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    min_bits: 2048
    flags: [deprecated]
    nist_level: 0
    oid: 1.2.840.10040.4.1
    aliases: [dsa, dss]
    patterns: ['^dsa[-_ ]?(?P<bits>\d{3,5})$']
  DH:
    name: DH
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    min_bits: 2048
    classical_by_bits: {1024: 80, 2048: 112, 3072: 128, 4096: 140, 6144: 170, 8192: 192}
    nist_level: 0
    oid: 1.2.840.113549.1.3.1
    aliases: [dh, dhe, ffdh, ffdhe, diffiehellman, diffie-hellman]
    patterns: ['^ffdhe(?P<bits>\d{4})$', '^(?:dh|modp)[-_ ]?(?P<bits>\d{4})$']
  ECDH:
    name: ECDH
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    nist_level: 0
    oid: 1.3.132.1.12
    aliases: [ecdh, ecdhe, ecdh-ephemeral]
  ECDSA:
    name: ECDSA
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    nist_level: 0
    oid: 1.2.840.10045.2.1
    aliases: [ecdsa, ec, id-ecpublickey]
  EC-P256:
    name: EC P-256 (secp256r1)
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    primitive_by_role: {signature: signature, certificate: signature}
    bits: 256
    classical_level: 128
    nist_level: 0
    oid: 1.2.840.10045.3.1.7
    aliases: [secp256r1, prime256v1, p-256, p256, nistp256, ecc_nist_p256, ec_prime256v1, ecdsa-p256, ecdh-p256]
  EC-P384:
    name: EC P-384 (secp384r1)
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    primitive_by_role: {signature: signature, certificate: signature}
    bits: 384
    classical_level: 192
    nist_level: 0
    oid: 1.3.132.0.34
    aliases: [secp384r1, prime384v1, p-384, p384, nistp384, ecc_nist_p384, ec_secp384r1, ecdsa-p384, ecdh-p384]
  EC-P521:
    name: EC P-521 (secp521r1)
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    primitive_by_role: {signature: signature, certificate: signature}
    bits: 521
    classical_level: 256
    nist_level: 0
    oid: 1.3.132.0.35
    aliases: [secp521r1, p-521, p521, nistp521, ecc_nist_p521, ec_secp521r1]
  EC-SECP256K1:
    name: EC secp256k1
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    bits: 256
    classical_level: 128
    nist_level: 0
    oid: 1.3.132.0.10
    aliases: [secp256k1, ecc_secg_p256k1]
  SM2:
    name: SM2
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    nist_level: 0
    oid: 1.2.156.10197.1.301
    aliases: [sm2]
  X25519:
    name: X25519
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    bits: 256
    classical_level: 128
    nist_level: 0
    oid: 1.3.101.110
    aliases: [x25519, curve25519, ecdh-x25519]
  X448:
    name: X448
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: key-agree
    bits: 448
    classical_level: 224
    nist_level: 0
    oid: 1.3.101.111
    aliases: [x448, curve448]
  Ed25519:
    name: Ed25519
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    bits: 256
    classical_level: 128
    nist_level: 0
    oid: 1.3.101.112
    aliases: [ed25519, eddsa]
  Ed448:
    name: Ed448
    kind: asymmetric
    threat: shor
    tier: CRITICAL
    primitive: signature
    bits: 448
    classical_level: 224
    nist_level: 0
    oid: 1.3.101.113
    aliases: [ed448]

  # ---------------------------------------------------------------- symmetric (Grover)
  AES:
    name: AES
    kind: symmetric
    threat: grover
    tier_by_bits: {128: MEDIUM, 192: MEDIUM, 256: SAFE}
    primitive: block-cipher
    classical_by_bits: {128: 128, 192: 192, 256: 256}
    nist_level_by_bits: {128: 1, 192: 3, 256: 5}
    oid: 2.16.840.1.101.3.4.1
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases:
      - aes
      - rijndael
      - {name: aesgcm, mode: gcm}                           # Python cryptography AESGCM class
      - {name: aesccm, mode: ccm}                           # Python cryptography AESCCM class
      - {name: aesocb3, mode: ocb}
      - {name: symmetric_default, bits: 256, mode: gcm}     # AWS KMS default key
      - {name: google_symmetric_encryption, bits: 256, mode: gcm}
    patterns:
      - '^aes[-_ ]?(?P<bits>128|192|256)(?:[-_ ]?(?P<mode>cbc|ctr|gcm|ccm|ecb|cfb|ofb|xts|ocb|ccm_8|ccm8))?$'
  3DES:
    name: 3DES
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    bits: 168
    classical_level: 112
    nist_level: 0
    flags: [deprecated]
    oid: 1.2.840.113549.3.7
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [3des, tripledes, desede, des-ede3, des3, 3des-ede, tdea]
    patterns: ['^(?:3des|des-ede3|desede|3des_ede)(?:[-_ ](?P<mode>cbc|ecb))?$']
  DES:
    name: DES
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    bits: 56
    classical_level: 56
    nist_level: 0
    flags: [classically-broken]
    oid: 1.3.14.3.2.7
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [des]
    patterns: ['^des[-_ ](?P<mode>cbc|ecb)$']
  RC4:
    name: RC4
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: stream-cipher
    nist_level: 0
    flags: [classically-broken]
    replacement: AES-256-GCM or ChaCha20-Poly1305
    standard: FIPS 197
    aliases: [rc4, arcfour, arc4]
    patterns: ['^rc4[-_ ]?(?P<bits>40|56|128)$']
  ChaCha20-Poly1305:
    name: ChaCha20-Poly1305
    kind: symmetric
    threat: grover
    tier: SAFE
    primitive: ae
    bits: 256
    classical_level: 256
    nist_level: 5
    aliases: [chacha20-poly1305, chacha20poly1305, chacha20_poly1305, chacha20]
  Camellia:
    name: Camellia
    kind: symmetric
    threat: grover
    tier_by_bits: {128: MEDIUM, 192: MEDIUM, 256: SAFE}
    primitive: block-cipher
    nist_level_by_bits: {128: 1, 192: 3, 256: 5}
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [camellia]
    patterns: ['^camellia[-_ ]?(?P<bits>128|192|256)(?:[-_ ]?(?P<mode>cbc|gcm|ctr))?$']
  ARIA:
    name: ARIA
    kind: symmetric
    threat: grover
    tier_by_bits: {128: MEDIUM, 192: MEDIUM, 256: SAFE}
    primitive: block-cipher
    nist_level_by_bits: {128: 1, 192: 3, 256: 5}
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [aria]
    patterns: ['^aria[-_ ]?(?P<bits>128|192|256)(?:[-_ ]?(?P<mode>cbc|gcm|ctr))?$']
  # legacy 64-bit-block / national ciphers still found in old TLS + SSH configs
  Blowfish:
    name: Blowfish
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    nist_level: 0
    flags: [deprecated]
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [blowfish, bf]
    patterns: ['^(?:blowfish|bf)[-_ ](?P<mode>cbc|ecb|cfb|ofb)$']
  CAST5:
    name: CAST5
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    nist_level: 0
    flags: [deprecated]
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [cast5, cast128, cast-128]
    patterns: ['^cast(?:5|128)[-_ ](?P<mode>cbc|ecb)$']
  IDEA:
    name: IDEA
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    bits: 128
    nist_level: 0
    flags: [deprecated]
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [idea]
    patterns: ['^idea[-_ ](?P<mode>cbc|ecb)$']
  SEED:
    name: SEED
    kind: symmetric
    threat: grover
    tier: MEDIUM
    primitive: block-cipher
    bits: 128
    nist_level: 1
    replacement: AES-256-GCM
    standard: FIPS 197
    aliases: [seed]
    patterns: ['^seed[-_ ](?P<mode>cbc|ecb)$']

  # ---------------------------------------------------------------- hashes
  MD5:
    name: MD5
    kind: hash
    threat: grover
    tier: MEDIUM
    primitive: hash
    nist_level: 0
    flags: [classically-broken]
    oid: 1.2.840.113549.2.5
    replacement: "SHA-256 (for passwords: Argon2id or PBKDF2-HMAC-SHA256)"
    standard: FIPS 180-4
    aliases: [md5]
  SHA-1:
    name: SHA-1
    kind: hash
    threat: grover
    tier: MEDIUM
    primitive: hash
    nist_level: 0
    flags: [classically-broken]
    oid: 1.3.14.3.2.26
    replacement: SHA-256 / SHA-384
    standard: FIPS 180-4
    aliases: [sha1, sha-1, sha, sha_1]
  SHA-224:
    name: SHA-224
    kind: hash
    threat: grover
    tier: MEDIUM
    primitive: hash
    nist_level: 1
    oid: 2.16.840.1.101.3.4.2.4
    replacement: SHA-384
    standard: FIPS 180-4
    aliases: [sha224, sha-224, sha2-224]
  SHA-256:
    name: SHA-256
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 2
    oid: 2.16.840.1.101.3.4.2.1
    aliases: [sha256, sha-256, sha2-256, sha_256, sha2]
  SHA-384:
    name: SHA-384
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 4
    oid: 2.16.840.1.101.3.4.2.2
    aliases: [sha384, sha-384, sha2-384, sha_384]
  SHA-512:
    name: SHA-512
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 5
    oid: 2.16.840.1.101.3.4.2.3
    aliases: [sha512, sha-512, sha2-512, sha_512]
  SHA3-256:
    name: SHA3-256
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 2
    oid: 2.16.840.1.101.3.4.2.8
    aliases: [sha3-256, sha3_256]
  SHA3-384:
    name: SHA3-384
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 4
    oid: 2.16.840.1.101.3.4.2.9
    aliases: [sha3-384, sha3_384]
  SHA3-512:
    name: SHA3-512
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 5
    oid: 2.16.840.1.101.3.4.2.10
    aliases: [sha3-512, sha3_512]

  BLAKE2b:
    name: BLAKE2b
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 5
    aliases: [blake2b, blake2b512]
  BLAKE2s:
    name: BLAKE2s
    kind: hash
    threat: grover
    tier: SAFE
    primitive: hash
    nist_level: 2
    aliases: [blake2s, blake2s256]

  # ---------------------------------------------------------------- MACs / KDFs
  HMAC-MD5:
    name: HMAC-MD5
    kind: mac
    threat: grover
    tier: MEDIUM
    primitive: mac
    flags: [deprecated]
    replacement: HMAC-SHA256
    standard: FIPS 198-1
    aliases: [hmac-md5, hmacmd5, hmac_md5]
  HMAC-SHA1:
    name: HMAC-SHA1
    kind: mac
    threat: grover
    tier: MEDIUM
    primitive: mac
    flags: [deprecated]
    replacement: HMAC-SHA256
    standard: FIPS 198-1
    aliases: [hmac-sha1, hmacsha1, hmac_sha1]
  HMAC-SHA256:
    name: HMAC-SHA256
    kind: mac
    threat: grover
    tier: SAFE
    primitive: mac
    aliases: [hmac-sha256, hmacsha256, hmac-sha2-256, hmac_256, hmac_sha256]
  HMAC-SHA384:
    name: HMAC-SHA384
    kind: mac
    threat: grover
    tier: SAFE
    primitive: mac
    aliases: [hmac-sha384, hmacsha384, hmac-sha2-384, hmac_384]
  HMAC-SHA512:
    name: HMAC-SHA512
    kind: mac
    threat: grover
    tier: SAFE
    primitive: mac
    aliases: [hmac-sha512, hmacsha512, hmac-sha2-512, hmac_512]
  UMAC:
    name: UMAC
    kind: mac
    threat: grover
    tier: MEDIUM              # keyed with AES-128 (64- or 128-bit tags): Grover halves it
    primitive: mac
    replacement: hmac-sha2-256-etm or an AEAD cipher (AES-256-GCM / ChaCha20-Poly1305)
    standard: FIPS 198-1
    aliases: [umac-64, umac-128, umac-64-etm, umac-128-etm]
  PBKDF2:
    name: PBKDF2
    kind: kdf
    threat: grover
    tier: SAFE
    primitive: kdf
    oid: 1.2.840.113549.1.5.12
    aliases: [pbkdf2, pbkdf2hmac]
  HKDF:
    name: HKDF
    kind: kdf
    threat: grover
    tier: SAFE
    primitive: kdf
    aliases: [hkdf]
  scrypt:
    name: scrypt
    kind: kdf
    threat: grover
    tier: SAFE
    primitive: kdf
    aliases: [scrypt]
  bcrypt:
    name: bcrypt
    kind: kdf
    threat: grover
    tier: SAFE
    primitive: kdf
    aliases: [bcrypt]
  Argon2:
    name: Argon2
    kind: kdf
    threat: grover
    tier: SAFE
    primitive: kdf
    aliases: [argon2, argon2id, argon2i, argon2d]

  # ---------------------------------------------------------------- post-quantum (NIST)
  ML-KEM-512:
    name: ML-KEM-512
    kind: pqc
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 1
    oid: 2.16.840.1.101.3.4.4.1
    standard: FIPS 203
    aliases: [ml-kem-512, mlkem512, kyber512]
  ML-KEM-768:
    name: ML-KEM-768
    kind: pqc
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 3
    oid: 2.16.840.1.101.3.4.4.2
    standard: FIPS 203
    aliases: [ml-kem-768, mlkem768, kyber768, ml-kem]
  ML-KEM-1024:
    name: ML-KEM-1024
    kind: pqc
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 5
    oid: 2.16.840.1.101.3.4.4.3
    standard: FIPS 203
    aliases: [ml-kem-1024, mlkem1024, kyber1024]
  ML-DSA-44:
    name: ML-DSA-44
    kind: pqc
    threat: none
    tier: SAFE
    primitive: signature
    nist_level: 2
    oid: 2.16.840.1.101.3.4.3.17
    standard: FIPS 204
    aliases: [ml-dsa-44, mldsa44, ml_dsa_44, dilithium2]
  ML-DSA-65:
    name: ML-DSA-65
    kind: pqc
    threat: none
    tier: SAFE
    primitive: signature
    nist_level: 3
    oid: 2.16.840.1.101.3.4.3.18
    standard: FIPS 204
    aliases: [ml-dsa-65, mldsa65, ml_dsa_65, dilithium3, ml-dsa]
  ML-DSA-87:
    name: ML-DSA-87
    kind: pqc
    threat: none
    tier: SAFE
    primitive: signature
    nist_level: 5
    oid: 2.16.840.1.101.3.4.3.19
    standard: FIPS 204
    aliases: [ml-dsa-87, mldsa87, ml_dsa_87, dilithium5]
  SLH-DSA:
    name: SLH-DSA
    kind: pqc
    threat: none
    tier: SAFE
    primitive: signature
    nist_level: 1
    standard: FIPS 205
    aliases: [slh-dsa, slhdsa, sphincs+, sphincsplus, sphincs]
    patterns: ['^slh[-_]?dsa[-_].*$']
  FN-DSA:
    name: FN-DSA (Falcon)
    kind: pqc
    threat: none
    tier: SAFE
    primitive: signature
    flags: [draft-standard]
    standard: FIPS 206 (draft)
    aliases: [fn-dsa, falcon, falcon512, falcon1024]

  # ---------------------------------------------------------------- hybrids
  X25519MLKEM768:
    name: X25519MLKEM768
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 3
    flags: [hybrid]
    standard: FIPS 203
    aliases: [x25519mlkem768]
  SecP256r1MLKEM768:
    name: SecP256r1MLKEM768
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 3
    flags: [hybrid]
    standard: FIPS 203
    aliases: [secp256r1mlkem768]
  SecP384r1MLKEM1024:
    name: SecP384r1MLKEM1024
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 5
    flags: [hybrid]
    standard: FIPS 203
    aliases: [secp384r1mlkem1024]
  MLKEM768-X25519-SSH:
    name: mlkem768x25519-sha256 (SSH hybrid)
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    nist_level: 3
    flags: [hybrid]
    standard: FIPS 203
    aliases: [mlkem768x25519]
  SNTRUP761-X25519:
    name: sntrup761x25519 (SSH hybrid)
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    flags: [hybrid, non-nist-pqc]
    standard: none (NTRU Prime; migrate to ML-KEM, FIPS 203)
    aliases: [sntrup761x25519, sntrup761]
  X25519Kyber768Draft00:
    name: X25519Kyber768Draft00
    kind: hybrid
    threat: none
    tier: SAFE
    primitive: kem
    flags: [hybrid, pre-standard]
    standard: pre-standard draft (migrate to X25519MLKEM768, FIPS 203)
    aliases: [x25519kyber768draft00, x25519kyber768, secp256r1kyber768draft00]

  # ---------------------------------------------------------------- randomness
  INSECURE-RNG:
    name: Non-cryptographic RNG
    kind: rng
    threat: none
    tier: INFO               # not a quantum issue, but a real classical weakness (flagged weak-rng)
    primitive: drbg
    flags: [weak-rng]
    replacement: "CSPRNG (Python secrets/os.urandom, Java SecureRandom, Go crypto/rand)"
    standard: NIST SP 800-90A
    aliases: [insecure-random, insecure-rng, math-rand]

  # ---------------------------------------------------------------- no crypto
  PLAINTEXT:
    name: No encryption (plaintext)
    kind: none
    threat: none
    tier: PLAINTEXT
    primitive: other
    replacement: TLS 1.3 with X25519MLKEM768 + AES-256-GCM
    standard: FIPS 203
    aliases: [plaintext, none, "null", cleartext, http, unencrypted]

# Names made of several algorithms. Keys are compared lowercase, without an
# "@vendor" suffix. role overrides the finding's usage for that component.
composites:
  # --- SSH key exchange
  diffie-hellman-group1-sha1:          [{alg: DH, bits: 1024, role: key_exchange}, {alg: SHA-1, role: hash}]
  diffie-hellman-group14-sha1:         [{alg: DH, bits: 2048, role: key_exchange}, {alg: SHA-1, role: hash}]
  diffie-hellman-group14-sha256:       [{alg: DH, bits: 2048, role: key_exchange}, {alg: SHA-256, role: hash}]
  diffie-hellman-group16-sha512:       [{alg: DH, bits: 4096, role: key_exchange}, {alg: SHA-512, role: hash}]
  diffie-hellman-group18-sha512:       [{alg: DH, bits: 8192, role: key_exchange}, {alg: SHA-512, role: hash}]
  diffie-hellman-group-exchange-sha1:  [{alg: DH, role: key_exchange}, {alg: SHA-1, role: hash}]
  diffie-hellman-group-exchange-sha256: [{alg: DH, role: key_exchange}, {alg: SHA-256, role: hash}]
  ecdh-sha2-nistp256:                  [{alg: EC-P256, role: key_exchange}, {alg: SHA-256, role: hash}]
  ecdh-sha2-nistp384:                  [{alg: EC-P384, role: key_exchange}, {alg: SHA-384, role: hash}]
  ecdh-sha2-nistp521:                  [{alg: EC-P521, role: key_exchange}, {alg: SHA-512, role: hash}]
  curve25519-sha256:                   [{alg: X25519, role: key_exchange}, {alg: SHA-256, role: hash}]
  curve448-sha512:                     [{alg: X448, role: key_exchange}, {alg: SHA-512, role: hash}]
  sntrup761x25519-sha512:              [{alg: SNTRUP761-X25519, role: key_exchange}, {alg: SHA-512, role: hash}]
  mlkem768x25519-sha256:               [{alg: MLKEM768-X25519-SSH, role: key_exchange}, {alg: SHA-256, role: hash}]
  # --- SSH host keys / signatures
  ssh-rsa:                             [{alg: RSA, role: signature}, {alg: SHA-1, role: hash}]
  rsa-sha2-256:                        [{alg: RSA, role: signature}, {alg: SHA-256, role: hash}]
  rsa-sha2-512:                        [{alg: RSA, role: signature}, {alg: SHA-512, role: hash}]
  ssh-dss:                             [{alg: DSA, role: signature}, {alg: SHA-1, role: hash}]
  ssh-ed25519:                         [{alg: Ed25519, role: signature}]
  ssh-ed448:                           [{alg: Ed448, role: signature}]
  ecdsa-sha2-nistp256:                 [{alg: EC-P256, role: signature}, {alg: SHA-256, role: hash}]
  ecdsa-sha2-nistp384:                 [{alg: EC-P384, role: signature}, {alg: SHA-384, role: hash}]
  ecdsa-sha2-nistp521:                 [{alg: EC-P521, role: signature}, {alg: SHA-512, role: hash}]
  # --- SSH MACs
  hmac-sha2-256-etm:                   [{alg: HMAC-SHA256, role: mac}]
  hmac-sha2-512-etm:                   [{alg: HMAC-SHA512, role: mac}]
  hmac-sha1-etm:                       [{alg: HMAC-SHA1, role: mac}]
  # --- TLS signature schemes (IANA names)
  rsa_pkcs1_sha1:                      [{alg: RSA, role: signature}, {alg: SHA-1, role: hash}]
  rsa_pkcs1_sha256:                    [{alg: RSA, role: signature}, {alg: SHA-256, role: hash}]
  rsa_pkcs1_sha384:                    [{alg: RSA, role: signature}, {alg: SHA-384, role: hash}]
  rsa_pkcs1_sha512:                    [{alg: RSA, role: signature}, {alg: SHA-512, role: hash}]
  rsa_pss_rsae_sha256:                 [{alg: RSA, role: signature}, {alg: SHA-256, role: hash}]
  rsa_pss_rsae_sha384:                 [{alg: RSA, role: signature}, {alg: SHA-384, role: hash}]
  rsa_pss_rsae_sha512:                 [{alg: RSA, role: signature}, {alg: SHA-512, role: hash}]
  rsa_pss_pss_sha256:                  [{alg: RSA, role: signature}, {alg: SHA-256, role: hash}]
  rsa_pss_pss_sha384:                  [{alg: RSA, role: signature}, {alg: SHA-384, role: hash}]
  rsa_pss_pss_sha512:                  [{alg: RSA, role: signature}, {alg: SHA-512, role: hash}]
  ecdsa_secp256r1_sha256:              [{alg: EC-P256, role: signature}, {alg: SHA-256, role: hash}]
  ecdsa_secp384r1_sha384:              [{alg: EC-P384, role: signature}, {alg: SHA-384, role: hash}]
  ecdsa_secp521r1_sha512:              [{alg: EC-P521, role: signature}, {alg: SHA-512, role: hash}]
  ecdsa_sha1:                          [{alg: ECDSA, role: signature}, {alg: SHA-1, role: hash}]
  ed25519:                             [{alg: Ed25519, role: signature}]
  ed448:                               [{alg: Ed448, role: signature}]
  mldsa44:                             [{alg: ML-DSA-44, role: signature}]
  mldsa65:                             [{alg: ML-DSA-65, role: signature}]
  mldsa87:                             [{alg: ML-DSA-87, role: signature}]

# Regex families of composite names; {group} is filled from the match.
composite_patterns:
  # AWS KMS signing / encryption algorithm names
  - regex: '^rsassa_(?:pkcs1_v1_5|pss)_sha_(?P<h>1|256|384|512)$'
    components: [{alg: RSA, role: signature}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^rsaes_oaep_sha_(?P<h>1|256)$'
    components: [{alg: RSA, role: encryption}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^ecdsa_sha_(?P<h>256|384|512)$'
    components: [{alg: ECDSA, role: signature}, {alg: 'SHA-{h}', role: hash}]
  # GCP Cloud KMS algorithm names
  - regex: '^rsa_sign_(?:pkcs1|pss|raw_pkcs1)_(?P<bits>\d{4})(?:_sha(?P<h>256|512))?$'
    components: [{alg: RSA, bits: '{bits}', role: signature}, {alg: 'SHA-{h}', role: hash, optional: h}]
  - regex: '^rsa_decrypt_oaep_(?P<bits>\d{4})_sha(?P<h>1|256|512)$'
    components: [{alg: RSA, bits: '{bits}', role: encryption}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^ec_sign_p(?P<c>256|384)_sha(?P<h>256|384)$'
    components: [{alg: 'EC-P{c}', role: signature}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^ec_sign_secp256k1_sha256$'
    components: [{alg: EC-SECP256K1, role: signature}, {alg: SHA-256, role: hash}]
  - regex: '^ec_sign_ed25519$'
    components: [{alg: Ed25519, role: signature}]
  - regex: '^pq_sign_ml_dsa_(?P<n>44|65|87)$'
    components: [{alg: 'ML-DSA-{n}', role: signature}]
  - regex: '^pq_sign_slh_dsa_.*$'
    components: [{alg: SLH-DSA, role: signature}]
  # JOSE / JWT "alg" and "enc" values (RFC 7518): PyJWT, python-jose, jsonwebtoken, jose, nimbus ...
  - regex: '^(?:rs|ps)(?P<h>256|384|512)$'
    components: [{alg: RSA, role: signature}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^es256$'
    components: [{alg: EC-P256, role: signature}, {alg: SHA-256, role: hash}]
  - regex: '^es384$'
    components: [{alg: EC-P384, role: signature}, {alg: SHA-384, role: hash}]
  - regex: '^es512$'
    components: [{alg: EC-P521, role: signature}, {alg: SHA-512, role: hash}]
  - regex: '^es256k$'
    components: [{alg: EC-SECP256K1, role: signature}, {alg: SHA-256, role: hash}]
  - regex: '^hs(?P<h>256|384|512)$'
    components: [{alg: 'HMAC-SHA{h}', role: mac}]
  - regex: '^rsa-oaep-(?P<h>256|384|512)$'
    components: [{alg: RSA, role: encryption}, {alg: 'SHA-{h}', role: hash}]
  - regex: '^rsa1_5$'
    components: [{alg: RSA, role: encryption}]
  - regex: '^ecdh-es(?:\+a(?:128|192|256)kw)?$'
    components: [{alg: ECDH, role: key_exchange}]
  - regex: '^a(?P<bits>128|192|256)gcm$'
    components: [{alg: AES, bits: '{bits}', mode: gcm, role: encryption}]
  - regex: '^a(?P<bits>128|192|256)(?:gcm)?kw$'
    components: [{alg: AES, bits: '{bits}', role: encryption}]
  - regex: '^a(?P<bits>128|192|256)cbc-hs(?P<h>256|384|512)$'
    components: [{alg: AES, bits: '{bits}', mode: cbc, role: encryption}, {alg: 'HMAC-SHA{h}', role: mac}]
  # PBKDF2 with an explicit PRF, e.g. Java "PBKDF2WithHmacSHA256"
  - regex: '^pbkdf2with(?P<prf>hmac[a-z0-9]+)$'
    components: [{alg: PBKDF2, role: kdf}, {alg: '{prf}', role: mac}]

