# Web shop on Apache httpd
SSLProtocol all -SSLv3
SSLHonorCipherOrder on

<VirtualHost *:443>
    ServerName shop.example.lab
    SSLEngine on
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519
    SSLCertificateFile /etc/ssl/certs/shop.pem
</VirtualHost>

<VirtualHost *:80>
    ServerName shop.example.lab
    Redirect permanent / https://shop.example.lab/
</VirtualHost>
