# Secrets vault: TLS 1.3 only, AES-256 / ChaCha20 only, post-quantum key exchange only, ML-DSA certificate
server {
    listen 443 ssl;
    server_name vault.example.lab;
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_certificate /etc/nginx/certs/vault-mldsa.pem;
}
