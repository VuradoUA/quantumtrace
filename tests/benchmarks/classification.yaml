# Classification benchmark: algorithm names labelled from the CHALLENGE definitions and NIST,
# written independently of catalog.yaml (do not generate these labels from the tool).
#   CRITICAL  asymmetric, broken by Shor (RSA, DSA, ECDSA, ECDH, DH, EdDSA, X25519 ...) at ANY key size
#   MEDIUM    symmetric cipher / hash / MAC weakened by Grover below 256-bit strength (AES-128/192, 3DES, SHA-1, MD5)
#   SAFE      AES-256 class symmetric, SHA-256 and larger hashes, NIST PQC (FIPS 203/204/205) and PQ hybrids
#   PLAINTEXT no encryption
# threat: shor | grover | none.  Policy choices (documented): SHA-256 / HMAC-SHA256 = SAFE; AES-192 = MEDIUM.
cases:
  # --- Shor: asymmetric, any size, any spelling
  - {name: RSA, usage: signature, bits: 1024, tier: CRITICAL, threat: shor}
  - {name: RSA, usage: encryption, bits: 2048, tier: CRITICAL, threat: shor, hndl: true}
  - {name: RSA, usage: signature, bits: 4096, tier: CRITICAL, threat: shor}
  - {name: RSA_3072, usage: signature, tier: CRITICAL, threat: shor}
  - {name: rsaEncryption, usage: certificate, bits: 2048, tier: CRITICAL, threat: shor}
  - {name: SHA256withRSA, usage: signature, tier: CRITICAL, threat: shor}
  - {name: SHA1withRSA, usage: signature, tier: CRITICAL, threat: shor}
  - {name: RSA/ECB/OAEPWithSHA-256AndMGF1Padding, usage: encryption, tier: CRITICAL, threat: shor, hndl: true}
  - {name: DSA, usage: signature, bits: 2048, tier: CRITICAL, threat: shor}
  - {name: SHA256withDSA, usage: signature, tier: CRITICAL, threat: shor}
  - {name: ECDSA, usage: signature, tier: CRITICAL, threat: shor}
  - {name: secp256r1, usage: signature, tier: CRITICAL, threat: shor}
