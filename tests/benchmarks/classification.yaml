  - {name: P-384, usage: signature, tier: CRITICAL, threat: shor}
  - {name: secp521r1, usage: key_exchange, tier: CRITICAL, threat: shor, hndl: true}
  - {name: secp256k1, usage: signature, tier: CRITICAL, threat: shor}
