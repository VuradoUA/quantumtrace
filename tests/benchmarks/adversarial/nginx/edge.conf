server {
    listen 443 ssl;
    server_name edge.example.lab;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519MLKEM768:X25519;
    location / { proxy_pass http://127.0.0.1:9000; }
}

server {
    listen 8443 ssl;
    server_name admin.example.lab;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
    location / { proxy_pass http://127.0.0.1:9001; }
}
