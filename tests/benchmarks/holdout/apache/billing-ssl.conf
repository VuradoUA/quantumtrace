# Billing portal (behind the corporate proxy)
<VirtualHost *:443>
    ServerName billing.example.lab
    SSLEngine on
    SSLProtocol -all +TLSv1.2
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:AES256-SHA
    SSLOpenSSLConfCmd Groups secp384r1
    SSLCertificateFile /etc/ssl/certs/billing.pem
</VirtualHost>
