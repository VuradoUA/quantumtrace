# Hand-verified ground truth for the organisers' starter kit (JunctionX-QuantumTrace/).
# Verified 2026-10-10 by reading every file / running tshark.
#
#   expected    what the final verdict for that asset must be
#   components  what the parser for that source should report (raw names exactly as
#               they appear in the input). Phase 1 feeds these straight into the
#               classifier; Phase 2 checks that the parsers really produce them.
#   parser_flags  facts only a parser can know (hardcoded key, expired cert, ...)
#   phase       if set, the entry can only be checked once that parser exists

code:
  # 1. AES-128-ECB export encryption (hardcoded 16-byte key, insecure RNG for tokens)
  - {file: python/report_export.py, scenario: aes128-ecb, expected: {tier: MEDIUM, hndl: false, flags: [insecure-mode]},
     components: [{algorithm: AES, key_size: 128, mode: ecb, usage: encryption}], parser_flags: [hardcoded-key, weak-rng]}
  - {file: java/BatchExporter.java, scenario: aes128-ecb, expected: {tier: MEDIUM, hndl: false, flags: [insecure-mode]},
     components: [{algorithm: AES/ECB/PKCS5Padding, key_size: 128, usage: encryption}], parser_flags: [hardcoded-key, weak-rng]}
  - {file: go/batch-pipeline/main.go, scenario: aes128-ecb, expected: {tier: MEDIUM, hndl: false, flags: [insecure-mode]},
     components: [{algorithm: AES, key_size: 128, mode: ecb, usage: encryption}], parser_flags: [hardcoded-key, weak-rng, hand-rolled-mode]}
  # 2. SHA-384 checksum + HMAC-SHA256 tag (decoy: all safe)
  - {file: python/artifact_manifest.py, scenario: sha384-hmac, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: sha384, usage: hash}, {algorithm: HMAC-SHA256, usage: mac}]}
  - {file: java/ConfigSync.java, scenario: sha384-hmac, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: SHA-384, usage: hash}, {algorithm: HmacSHA256, usage: mac}]}
  - {file: go/config-sync/main.go, scenario: sha384-hmac, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: SHA-384, usage: hash}, {algorithm: HMAC-SHA256, usage: mac}]}
  # 3. MD5 password hashing
  - {file: python/legacy_accounts.py, scenario: md5-passwords, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: md5, usage: hash}], parser_flags: [password-hash]}
  - {file: java/CustomerDirectory.java, scenario: md5-passwords, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: MD5, usage: hash}], parser_flags: [password-hash]}
  - {file: go/member-directory/main.go, scenario: md5-passwords, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: MD5, usage: hash}], parser_flags: [password-hash]}
  # 4. Ed25519 signatures (modern, but Shor-breakable)
  - {file: python/webhook_signature.py, scenario: ed25519, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: Ed25519, usage: signature}]}
  - {file: java/DeviceAttestation.java, scenario: ed25519, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: Ed25519, usage: signature}]}
  - {file: go/agent-enrollment/main.go, scenario: ed25519, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: Ed25519, usage: signature}]}
  # 5. PBKDF2-HMAC-SHA256, 600k iterations
  - {file: python/member_credentials.py, scenario: pbkdf2, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: PBKDF2HMAC, usage: kdf}, {algorithm: SHA256, usage: hash}]}
  - {file: java/IdentityVault.java, scenario: pbkdf2, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: PBKDF2WithHmacSHA256, usage: kdf}]}
  - {file: go/auth-gateway/main.go, scenario: pbkdf2, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: PBKDF2, usage: kdf}, {algorithm: HMAC-SHA256, usage: mac}], parser_flags: [hand-rolled-kdf]}
  # 6. RSA-1024 + SHA-1 (PKCS#1 v1.5) signatures
  - {file: python/license_token.py, scenario: rsa1024-sha1, expected: {tier: CRITICAL, hndl: false, flags: [weak-key-size, classically-broken]},
     components: [{algorithm: RSA, key_size: 1024, usage: signature}, {algorithm: SHA1, usage: hash}]}
  - {file: java/ReceiptSigner.java, scenario: rsa1024-sha1, expected: {tier: CRITICAL, hndl: false, flags: [weak-key-size, classically-broken]},
     components: [{algorithm: RSA, key_size: 1024, usage: signature}, {algorithm: SHA1withRSA, usage: signature}]}
  - {file: go/invoice-service/main.go, scenario: rsa1024-sha1, expected: {tier: CRITICAL, hndl: false, flags: [weak-key-size, classically-broken]},
     components: [{algorithm: RSA, key_size: 1024, usage: signature}, {algorithm: SHA-1, usage: hash}]}
  # 7. AES-256-GCM transfer encryption
  - {file: python/secure_transfer.py, scenario: aes256-gcm, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: AESGCM, key_size: 256, mode: gcm, usage: encryption}]}
  - {file: java/SessionCipher.java, scenario: aes256-gcm, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: AES/GCM/NoPadding, key_size: 256, usage: encryption}]}
  - {file: go/telemetry-relay/main.go, scenario: aes256-gcm, expected: {tier: SAFE, hndl: false},
     components: [{algorithm: AES, key_size: 256, mode: gcm, usage: encryption}]}
  # 8. SHA-1 update checksum
  - {file: python/update_feed.py, scenario: sha1-checksum, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: sha1, usage: hash}]}
  - {file: java/PatchFeed.java, scenario: sha1-checksum, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: SHA-1, usage: hash}]}
  - {file: go/release-feed/main.go, scenario: sha1-checksum, expected: {tier: MEDIUM, hndl: false, flags: [classically-broken]},
     components: [{algorithm: SHA-1, usage: hash}]}

