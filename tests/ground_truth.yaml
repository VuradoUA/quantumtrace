cloud_certificates:
  - {domain: www.example.com, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: RSA_2048, usage: certificate}, {algorithm: SHA256WITHRSA, usage: certificate}], parser_flags: [expiring-soon]}
  - {domain: admin.internal.example.com, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: EC_prime256v1, usage: certificate}, {algorithm: ECDSA_WITH_SHA256, usage: certificate}]}
  - {domain: api.example.com, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: RSA_2048, usage: certificate}, {algorithm: SHA256WITHRSA, usage: certificate}]}
  - {domain: partner-api.example.com, expected: {tier: CRITICAL, hndl: false},
     components: [{algorithm: EC_secp384r1, usage: certificate}, {algorithm: ECDSA_WITH_SHA384, usage: certificate}]}
  - {domain: legacy-tcp.internal.example.com, expected: {tier: CRITICAL, hndl: false, flags: [classically-broken]},
     components: [{algorithm: RSA_2048, usage: certificate}, {algorithm: SHA1WITHRSA, usage: certificate}], parser_flags: [expired, imported, renewal-ineligible]}

cloud_listeners:   # TLS listeners have no `components`: checked end-to-end in test_cloud_parser.py
  # (Phase 3) no `classically-broken` here: the policy's "-SHA" suites use HMAC-SHA1, which SHA-1 collisions do not break
  - {listener: public-web-alb:443, policy: ELBSecurityPolicy-2016-08, expected: {tier: CRITICAL, hndl: true, flags: [no-forward-secrecy, tls1.0-enabled, tls1.1-enabled, deprecated]},
     absent_flags: [classically-broken]}
  - {listener: public-web-alb:80, expected: {tier: INFO, hndl: false}, parser_flags: [redirect-to-https],
     components: [{algorithm: plaintext, usage: protocol, flags: [redirect-to-https]}]}
  - {listener: internal-admin-alb:443, policy: ELBSecurityPolicy-TLS-1-1-2017-01, expected: {tier: CRITICAL, hndl: true, flags: [no-forward-secrecy, tls1.1-enabled]}}
  - {listener: api-gateway-alb:443, policy: ELBSecurityPolicy-FS-1-2-Res-2020-10, expected: {tier: CRITICAL, hndl: true}, absent_flags: [no-forward-secrecy]}
  - {listener: partner-api-alb:443, policy: ELBSecurityPolicy-TLS13-1-2-2021-06, expected: {tier: CRITICAL, hndl: true}, absent_flags: [no-forward-secrecy]}
  - {listener: legacy-tcp-nlb:8443, policy: ELBSecurityPolicy-TLS-1-2-2017-01, expected: {tier: CRITICAL, hndl: true, flags: [no-forward-secrecy]}}
  - {listener: batch-internal-alb:80, expected: {tier: PLAINTEXT, hndl: false},
     components: [{algorithm: plaintext, usage: protocol}]}

pcap:
  - {setup: tls12-static-rsa, sessions: 54, ports: {443: 33, 587: 11, 636: 10},
     expected: {tier: CRITICAL, hndl: true, flags: [no-forward-secrecy]},
     components: [{algorithm: TLS_RSA_WITH_AES_128_CBC_SHA, usage: protocol}]}
  - {setup: tls13-x25519, sessions: 36, ports: {443: 18, 993: 10, 5432: 8},
     expected: {tier: CRITICAL, hndl: true},
     components: [{algorithm: TLS_AES_128_GCM_SHA256, usage: protocol}, {algorithm: x25519, usage: key_exchange}]}
  - {setup: tls13-hybrid-pq, sessions: 7, ports: {443: 7},
     expected: {tier: SAFE, hndl: false, flags: [hybrid]},
     components: [{algorithm: TLS_AES_256_GCM_SHA384, usage: protocol}, {algorithm: X25519MLKEM768, usage: key_exchange}]}
  - {setup: ssh-legacy, sessions: 14, ports: {22: 14},
     expected: {tier: CRITICAL, hndl: true, flags: [classically-broken]},
     components: [{algorithm: diffie-hellman-group14-sha1, usage: key_exchange}, {algorithm: ssh-rsa, usage: signature},
                  {algorithm: aes128-cbc, usage: encryption}, {algorithm: hmac-sha1, usage: mac}],   # MAC verified with tshark 2026-10-11
     also_offered: [{algorithm: diffie-hellman-group1-sha1, usage: key_exchange}, {algorithm: 3des-cbc, usage: encryption}]}  # weaker options BOTH KEXINITs list (downgrade risk)
  - {setup: ssh-modern, sessions: 10, ports: {22: 10},
     expected: {tier: CRITICAL, hndl: true},
     components: [{algorithm: curve25519-sha256, usage: key_exchange}, {algorithm: rsa-sha2-512, usage: signature},
                  {algorithm: chacha20-poly1305@openssh.com, usage: encryption}]}
  - {setup: http-plaintext, sessions: 14, ports: {80: 14},
     expected: {tier: PLAINTEXT, hndl: false},
     components: [{algorithm: plaintext, usage: protocol}]}

# Phase 2d: cryptographic libraries declared in the kit's manifests (paths relative to sample-repos/)
libraries:
  - {file: python/requirements.txt, library: cryptography, purl: pkg:pypi/cryptography@46.0.5,
     flags: [no-pqc-api],            # ML-KEM / ML-DSA API only from 48.0.0
     used_by: [python/license_token.py, python/member_credentials.py, python/report_export.py,
               python/secure_transfer.py, python/webhook_signature.py]}
  - {file: go/go.mod, library: stdlib, purl: pkg:golang/stdlib@1.24,
     flags: [pqc-capable, pq-tls-default],   # go 1.24: crypto/mlkem + X25519MLKEM768 on by default in crypto/tls
     used_by: [go/agent-enrollment/main.go, go/auth-gateway/main.go, go/batch-pipeline/main.go,
               go/config-sync/main.go, go/invoice-service/main.go, go/member-directory/main.go,
               go/release-feed/main.go, go/telemetry-relay/main.go]}

